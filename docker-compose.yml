services:
  ollama-relay:
    image: docker.io/alpine/socat:latest
    restart: unless-stopped
    network_mode: host
    command: TCP-LISTEN:11435,fork,reuseaddr TCP-CONNECT:127.0.0.1:11434

  caddy:
    image: docker.io/library/caddy:2-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./infrastructure/Caddyfile:/etc/caddy/Caddyfile:z
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8000"
    env_file:
      - ./backend/.env
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11435
    extra_hosts:
      - host.docker.internal:host-gateway

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      - backend

volumes:
  caddy_data:
  caddy_config:
