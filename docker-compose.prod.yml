services:
  ollama-relay:
    image: alpine/socat:latest
    network_mode: host
    restart: unless-stopped
    command: TCP-LISTEN:11435,fork,reuseaddr TCP-CONNECT:127.0.0.1:11434
    extra_hosts:
      - host.docker.internal:host-gateway

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./infrastructure/Caddyfile.prod:/etc/caddy/Caddyfile
      - caddy_data:/data
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8000"
    env_file:
      - ./backend/.env
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11435
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      - ollama-relay

volumes:
  caddy_data:
