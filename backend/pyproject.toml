[project]
name = "agri-agent-backend"
version = "0.1.0"
description = "Backend for Agricultural Advisory AI Agent"
authors = [{name = "AI Assistant"}]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.1",
    "pydantic>=2.7.4",
    "langchain-core>=0.2.9",
    "langgraph>=0.1.0",
    "chromadb>=0.5.0",
    "faster-whisper>=1.0.2",
    "ollama>=0.2.1",
    "python-multipart>=0.0.9",
    "requests>=2.32.3",
]
readme = "README.md"
requires-python = ">= 3.11"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agri_agent_backend"]
